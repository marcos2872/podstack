<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PodStack — Open Graph</title>
  <desc id="desc">Lockup do PodStack com a cápsula, o símbolo de camadas e a descrição do produto.</desc>
  <rect width="1200" height="630" fill="#0F1115"/>

  <!-- lockup -->
  <rect x="80" y="80" width="120" height="74" rx="37" fill="#3730A3"/>
  <rect x="95" y="99" width="32" height="36" rx="9" fill="#22D3EE"/>
  <rect x="135" y="99" width="32" height="36" rx="9" fill="#6366F1"/>
  <rect x="175" y="99" width="10" height="36" rx="5" fill="#A5B4FC"/>
  <text x="230" y="146" font-family="Inter, Manrope, 'IBM Plex Sans', system-ui, sans-serif" font-size="64" font-weight="600" letter-spacing="-1">
    <tspan fill="#E6EAF0">Pod</tspan><tspan fill="#22D3EE">Stack</tspan>
  </text>

  <!-- tagline -->
  <text x="80" y="300" font-family="Inter, Manrope, 'IBM Plex Sans', system-ui, sans-serif" font-size="40" font-weight="500" fill="#E6EAF0">Containers, Compose, VMs Linux, Kubernetes</text>
  <text x="80" y="354" font-family="Inter, Manrope, 'IBM Plex Sans', system-ui, sans-serif" font-size="40" font-weight="400" fill="#9AA4B2">e domínios locais — sobre Podman.</text>
  <text x="80" y="438" font-family="Inter, Manrope, 'IBM Plex Sans', system-ui, sans-serif" font-size="24" font-weight="500" fill="#A5B4FC">Linux desktop · Qt 6/QML · rootless por padrão</text>

  <!-- layers mark -->
  <rect x="920" y="170" width="180" height="48" rx="16" fill="#3730A3"/>
  <rect x="920" y="105" width="180" height="48" rx="16" fill="#6366F1"/>
  <rect x="920" y="40" width="180" height="48" rx="16" fill="#22D3EE"/>
  <circle cx="950" cy="194" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="950" cy="129" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="950" cy="64" r="8" fill="#0E3A47"/>

  <!-- footer rule -->
  <rect x="80" y="540" width="1040" height="2" fill="#2A313C"/>
</svg>
