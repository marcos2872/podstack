name: Packaging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build-*"
      - "scripts/clean-install-check.sh"
      - "CMakeLists.txt"
      - "third_party/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpm-clean-install:
    name: RPM e instalação limpa
    runs-on: ubuntu-latest
    # O script cria o próprio container Fedora via podman; o job precisa de
    # privilégios para o podman aninhado.
    container:
      image: fedora:44
      options: --privileged --cgroupns=host

    steps:
      - name: Instalar git (necessário para o checkout)
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Dependências
        run: |
          dnf install -y cmake ninja-build gcc-c++ \
            openssl-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwayland-devel \
            qt6-qt5compat-devel kf6-kstatusnotifieritem-devel \
            qtermwidget-devel libarchive-devel libcurl-devel sqlite-devel \
            libxcrypt-devel openssh-clients \
            rpm-build podman appstream make selinux-policy-devel policycoreutils

      - name: Empacotar RPM
        run: scripts/build-rpm.sh

      - name: Instalação limpa (smoke)
        run: scripts/clean-install-check.sh --skip-build

  deb-build:
    name: DEB (Ubuntu 24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - name: Instalar git (necessário para o checkout)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates

      - uses: actions/checkout@v4

      - name: Dependências
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev qt6-5compat-dev \
            qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            libarchive-dev libcurl4-openssl-dev libcrypt-dev libsqlite3-dev libssl-dev \
            appstream dpkg-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript qml6-module-qtquick-dialogs \
            qml6-module-qt5compat-graphicaleffects \
            libqt6sql6-sqlite qt6-wayland

      - name: Configurar (Qt 6.4 + qtermwidget vendorizado)
        run: |
          cmake -S . -B build/ubuntu -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DPODSTACK_USE_VENDORED_QTERMWIDGET=ON

      - name: Compilar
        run: cmake --build build/ubuntu -j"$(nproc)"

      - name: Instalar dados de runtime para os testes
        run: cmake --install build/ubuntu --prefix /usr --component Runtime

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/ubuntu --output-on-failure

      - name: Empacotar DEB
        run: PODSTACK_BUILD_DIR=build/ubuntu scripts/build-deb.sh

      - name: Inspecionar o DEB
        run: |
          dpkg-deb -I build/deb/*.deb
          dpkg-deb -c build/deb/*.deb | grep -E 'usr/bin/podstack|qtermwidget6/(color-schemes|kb-layouts)' | head -20
