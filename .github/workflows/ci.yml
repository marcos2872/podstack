name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Instalar git (necessário para o checkout)
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Site (gerador)
        run: python3 scripts/web_build.py --check

      - name: Dependências
        run: |
          dnf install -y cmake ninja-build gcc-c++ gcovr clang-tools-extra \
            appstream openssl-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwayland-devel \
            qt6-qt5compat-devel kf6-kstatusnotifieritem-devel \
            qtermwidget-devel libarchive-devel libcurl-devel sqlite-devel \
            libxcrypt-devel openssh-clients

      - name: Configurar (coverage)
        run: cmake --preset coverage

      - name: Compilar
        run: cmake --build --preset coverage

      - name: AppStream (validação)
        run: appstreamcli validate --no-net packaging/dev.podstack.PodStack.metainfo.xml

      - name: clang-format (linhas alteradas)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/check-format.sh origin/main

      - name: clang-tidy (fontes alterados)
        run: scripts/check-tidy.sh origin/main

      - name: Testes
        run: ctest --preset coverage --output-on-failure

      # O .gcda do podstackd é sobrescrito pelo último teste que o inicia.
      # Rodar o rpc por último preserva a cobertura mais ampla do Daemon.
      - name: Testes (rpc para cobertura do daemon)
        run: ctest --preset coverage -R rpc --output-on-failure

      - name: Cobertura (relatório)
        run: |
          set -o pipefail
          mkdir -p coverage
          gcovr -r . --filter 'src/' --gcov-ignore-parse-errors \
            --merge-mode-functions=separate \
            --xml coverage.xml \
            --html-details coverage/index.html \
            --txt-metric line --print-summary | tee coverage-summary.txt
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"

      # Gate bloqueante na meta de 80% sobre src/.
      - name: Cobertura (gate bloqueante)
        run: |
          set -o pipefail
          gcovr -r . --filter 'src/' --gcov-ignore-parse-errors \
            --merge-mode-functions=separate --fail-under-line 80 \
            --txt-metric line --print-summary | tee coverage-gate.txt
          cat coverage-gate.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage/
            coverage-summary.txt
            coverage-gate.txt
          if-no-files-found: warn

  ubuntu-24-04:
    name: Ubuntu 24.04 (Qt 6.4)
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - name: Instalar git (necessário para o checkout)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates

      - uses: actions/checkout@v4

      - name: Dependências
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev qt6-5compat-dev \
            qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            libarchive-dev libcurl4-openssl-dev libcrypt-dev libsqlite3-dev libssl-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript qml6-module-qtquick-dialogs \
            qml6-module-qt5compat-graphicaleffects \
            libqt6sql6-sqlite qt6-wayland

      - name: Configurar (Qt 6.4 + qtermwidget vendorizado)
        run: |
          cmake -S . -B build/ubuntu -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DPODSTACK_USE_VENDORED_QTERMWIDGET=ON

      - name: Compilar
        run: cmake --build build/ubuntu -j"$(nproc)"

      - name: Instalar dados de runtime para os testes
        run: cmake --install build/ubuntu --prefix /usr --component Runtime

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/ubuntu --output-on-failure
