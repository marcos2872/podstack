name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Instalar git (necessário para o checkout)
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Dependências
        run: |
          dnf install -y cmake ninja-build gcc-c++ gcovr \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwayland-devel \
            qtermwidget-devel libarchive-devel libcurl-devel sqlite-devel

      - name: Configurar (coverage)
        run: cmake --preset coverage

      - name: Compilar
        run: cmake --build --preset coverage

      - name: Testes
        run: ctest --preset coverage --output-on-failure

      # O .gcda do podstackd é sobrescrito pelo último teste que o inicia.
      # Rodar o rpc por último preserva a cobertura mais ampla do Daemon.
      - name: Testes (rpc para cobertura do daemon)
        run: ctest --preset coverage -R rpc --output-on-failure

      - name: Cobertura (relatório)
        run: |
          mkdir -p coverage
          gcovr -r . --filter 'src/' --gcov-ignore-parse-errors \
            --merge-mode-functions=separate \
            --xml coverage.xml \
            --html-details coverage/index.html \
            --txt-metric line --print-summary | tee coverage-summary.txt
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Cobertura (gate 80%)
        run: |
          gcovr -r . --filter 'src/' --gcov-ignore-parse-errors \
            --merge-mode-functions=separate \
            --txt-metric line --print-summary --fail-under-line 80 \
            | tee coverage-gate.txt
          cat coverage-gate.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage/
            coverage-summary.txt
            coverage-gate.txt
          if-no-files-found: warn
