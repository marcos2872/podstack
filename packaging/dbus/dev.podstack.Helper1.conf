<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Somente o root pode possuir o nome do helper. -->
  <policy user="root">
    <allow own="dev.podstack.Helper1"/>
  </policy>

  <!-- A autorização de cada método é feita pelo polkit (allowlist no helper). -->
  <policy context="default">
    <allow send_destination="dev.podstack.Helper1"/>
  </policy>
</busconfig>
